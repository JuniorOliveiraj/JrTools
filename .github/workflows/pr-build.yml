name: PR Build & Test

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'Docs/**'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # PublishReadyToRun fica ligado pro Release no JrTools.csproj (pensado pro publish
      # self-contained do release.yml, que passa -r win-x64). Num "dotnet build" sem RID
      # isso quebra com NETSDK1094 (falta pacote de runtime pra otimizar) — desligamos
      # aqui porque este workflow só valida que compila e os testes passam, não publica.
      #
      # -m:1 força o MSBuild a buildar um projeto por vez: com múltiplos nós em paralelo
      # (padrão do "dotnet build" numa .sln), o compilador XAML do WinUI disputa o mesmo
      # arquivo intermediário (obj\...\input.json) entre o build de JrTools.csproj e o
      # build aninhado do BennerSmartInstaller.csproj (via AfterTargets="Build"), e falha
      # com "The process cannot access the file... because it is being used by another
      # process". Sequencial evita a corrida.
      - name: Build (Release, x64)
        run: dotnet build JrTools.sln -c Release -p:Platform=x64 -p:PublishReadyToRun=false -m:1

      - name: Testes
        run: dotnet test JrTools.Tests/JrTools.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publicar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: JrTools.Tests/TestResults/test-results.trx
