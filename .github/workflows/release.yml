name: Release

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'Docs/**'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Publica o JrTools self-contained para win-x64. Isso também dispara o
      # target CopyBennerSmartInstaller (AfterTargets="Build") do csproj, que
      # builda o instalador legado (.NET Framework 4.8) e o copia para a pasta
      # de build intermediária — não para a pasta de publish, por isso o passo
      # seguinte busca o exe lá e o inclui manualmente no artefato final.
      - name: Publish JrTools (win-x64, self-contained)
        run: >
          dotnet publish JrTools/JrTools.csproj
          -c Release
          -p:Platform=x64
          -r win-x64
          --self-contained true
          -o publish

      - name: Incluir BennerSmartInstaller.exe no artefato
        shell: pwsh
        run: |
          $installer = "JrTools/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/BennerSmartInstaller.exe"
          Copy-Item $installer -Destination "publish/BennerSmartInstaller.exe" -Force

      - name: Remover arquivos de debug (.pdb)
        shell: pwsh
        run: Get-ChildItem -Path publish -Recurse -Filter *.pdb | Remove-Item -Force

      - name: Definir versão da release
        id: vars
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $tag = "build-${{ github.run_number }}-$sha"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "zip=JrTools-win-x64-$tag.zip" >> $env:GITHUB_OUTPUT

      - name: Compactar artefato
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath ${{ steps.vars.outputs.zip }}

      - name: Criar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: JrTools build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: ${{ steps.vars.outputs.zip }}
